<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://cdn.jsdelivr.net/npm/remixicon@4.3.0/fonts/remixicon.css" rel="stylesheet">
  <style>
    .main {
      width: 200px;
      margin: auto;
      margin-top: 100px;
      /* border: 1px solid black; */
    }

    .enter {
      height: 30px;
      display: flex;
      align-items: center;
      border: 1px solid black;
      width: 200px;
  

    }

    #select-date {
      height: 100%;
      border-radius: 0;
      padding: 0 0 0 7px;
      border: none;
      outline: none;
    }

    #select-date::placeholder {
      color: grey;
    }

    button {
      height: 100%;
      background-color: transparent;
      border: none;
      border-left: 1px solid black;
    }

    button img {
      width: 26px;

    }

    main {
      border: 1px solid black;
      margin-top: 2px;
      height: 206px;
    }

    .section1 {
      width: 200px;
    }

    .article-1 {
      display: flex;
      gap: 10px;
      justify-content: center;
      align-items: center;
      margin-bottom: 5px;
    }

    .article-1 i {
      font-size: 30px;
    }

    .article-2 {
      display: flex;
      justify-content: space-evenly;
    }

    .calander {
      width: 199px;
      height: 149px;
      border-top: 1px solid black;
      border-collapse: collapse;
    }

    .calander th,
    .calander td {
      border: 1px solid #333;
      padding: 0px 0;
      width: calc(100% / 7);
      font-size: 16px;
      text-align: center;
    }
    .calander tr td:first-child {
      border-left: none;
    }
  </style>
</head>

<body>
  <div class="main">

    <div class="enter">
      <input type="text" id="select-date" placeholder="dd/mm/yyyy">
      <button><img src="./assets/Calendar Mark.png" alt=""></button>
    </div>
    <main>
      <section class="section1">
        <article class="article-1">
          <i class="ri-arrow-left-s-fill"></i>
          <p>December 2022</p>
          <i class="ri-arrow-right-s-fill"></i>
        </article>
        <article class="article-2">
          <span>s</span><span>M</span><span>T</span><span>W</span><span>T</span><span>F</span><span>S</span>

        </article>

      </section>

      <section class="section2">
        <table class="calander">
          <tr>
            <td></td>
            <td></td>
            <td></td>
            <td></td>
            <td>1</td>
            <td>2</td>
            <td>3</td>
          </tr>
          <tr>
            <td>4</td>
            <td>5</td>
            <td>6</td>
            <td>7</td>
            <td>8</td>
            <td>9</td>
            <td>10</td>
          </tr>
          <tr>
            <td>11</td>
            <td>12</td>
            <td>13</td>
            <td>14</td>
            <td>15</td>
            <td>16</td>
            <td>17</td>
          </tr>
          <tr>
            <td>18</td>
            <td>19</td>
            <td>20</td>
            <td>21</td>
            <td>22</td>
            <td>23</td>
            <td>24</td>
          </tr>
          <tr>
            <td>25</td>
            <td>26</td>
            <td>27</td>
            <td>28</td>
            <td>29</td>
            <td>30</td>
            <td>31</td>
          </tr>

        </table>

      </section>
    </main>
  </div>

</body>

</html>
